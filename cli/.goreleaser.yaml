version: 2

project_name: agent-factory

builds:
  - main: .
    binary: agent-factory
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Without this a release binary reports "dev" and is indistinguishable
      # from a source build. .Tag, not .Version, so the string matches the
      # tag_name `update` reads back from the GitHub releases API.
      - -X github.com/wolzey/agent-factory/cli/cmd.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: wolzey
    name: agent-factory
